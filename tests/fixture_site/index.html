<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fixture Store — pricing</title>
  <meta name="description" content="A deliberately imperfect page used to exercise the SiteSentinel scanner offline." />
  <style>
    body { margin:0; font-family: Arial, sans-serif; color:#6b7280; background:#ffffff; }
    .wide { width: 1180px; background:#eef2f7; padding: 8px; }
    .low { color:#9ca3af; background:#f3f4f6; font-size: 11px; }
    input { padding: 3px; font-size: 11px; }
    h2 { color:#111827; }
  </style>
</head>
<body>
  <div class="wide"><h1>Fixture Store pricing</h1></div>
  <h2>Plans</h2>
  <p class="low">Starter, Growth and Enterprise. Prices available on request from our sales team.</p>
  <img src="/static-logo.png" width="180" height="60" />
  <h2>Talk to us</h2>
  <form action="/contact" method="post">
    <div>
      <input type="text" name="email" id="email" placeholder="Work email" />
    </div>
    <div>
      <input type="text" name="company" id="company" />
    </div>
    <div>
      <input type="text" name="notes" id="notes" placeholder="Anything else?" />
    </div>
    <button type="submit">Request a demo</button>
  </form>
  <p><a href="/terms">Terms</a></p>
</body>
</html>
